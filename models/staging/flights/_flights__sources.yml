sources:
  - name: demo_src
    description: Данные из БД авиаперелетов
    tables:
      - name: aircrafts
        description: Модели самолетов
        columns:
          - name: aircraft_code
            description: Код модели самолета
          - name: models
            description: Название модели самолета
          - name: range
            description: Максимальная длина полета
      - name: airports
        description: Аэропорты
        columns:
          - name: airport_code
            description: Код аэропорта
          - name: airport_name
            description: Название
          - name: city
            description: Город
          - name: coordinates
            description: Координаты
          - name: timezone
            description: Временная зона

      - name: seats
        description: Места в самолетах
        columns:
          - name: aircraft_code
            description: Код самолета
          - name: seat_no
            description: Номер места
          - name: fare_conditions
            description: Условия тарифа
      - name: bookings
        description: Бронирование
        columns:
          - name: book_ref
            description: Ссылка на бронирование
          - name: book_date
            description: Дата бронирования
          - name: total_amount
            description: Общая сумма бронирования
        freshness:
          warn_after: {count: 600000, period: hour}  # увеличено, чтобы не было ошибки
          error_after: {count: 10000, period: day}   # увеличено, чтобы не было ошибки
        loaded_at_field: book_date::timestamp
      - name: boarding_passes
        description: Посадочные талоны
        columns:
          - name: ticket_no
            description: Номер билета
          - name: flight_id
            description: Идентификатор рейса
          - name: boarding_no
            description: Порядковый номер посадочного талона
          - name: seat_no
            description: Номер посадочного места
      - name: flights
        description: Рейсы
        columns:
          - name: flight_id
            description: Идентификатор рейса
          - name: flight_no
            description: Номер рейса
          - name: scheduled_departure
            description: Время отправления
          - name: scheduled_arrival
            description: Время прибытия
          - name: departure_airport
            description: Аэропорт отправления
          - name: arrival_airport
            description: Аэропорт прибытия
          - name: status
            description: Статус рейса
          - name: aircraft_code
            description: Код модели самолета
          - name: actual_departure
            description: Фактическое время отправления
          - name: actual_arrival
            description: Фактическое время прибытия
      - name: ticket_flights
        description: Соединяет билет с конкретным рейсом
        columns:
          - name: ticket_no
            description: Номер билета
          - name: flight_id
            description: Идентификатор рейса
          - name: fare_conditions
            description: Класс обслуживания
          - name: amount
            description: Стоимость перелета